name: Catalogue

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "catalog/apps/**"
      - "catalog/deals/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Restrict public contributions to one new catalogue record
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t changes < <(git diff --name-status "$BASE_SHA" "$HEAD_SHA")
          if [[ ${#changes[@]} -ne 1 ]]; then
            echo "Public pull requests may only add exactly one application or deal manifest. Open an issue for every other kind of change."
            printf '%s\n' "${changes[@]}"
            exit 1
          fi

          IFS=$'\t' read -r status changed_path <<< "${changes[0]}"
          if [[ "$status" != "A" || ! "$changed_path" =~ ^catalog/(apps|deals)/[a-z0-9]+(-[a-z0-9]+)*\.json$ ]]; then
            echo "Public pull requests may only add one new catalogue manifest and change nothing else. Open an issue for every other kind of change."
            exit 1
          fi
      - run: node scripts/validate-catalogue.mjs

  sync:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push event can contain more than one commit. Full history keeps
          # the before/after diff reliable for every accepted main-branch push.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Create pending editorial revisions
        env:
          CATALOG_SYNC_SECRET: ${{ secrets.CATALOG_SYNC_SECRET }}
          CATALOG_SYNC_URL: ${{ secrets.CATALOG_SYNC_URL }}
        run: node scripts/sync-catalogue-changes.mjs "${{ github.event.before }}" "${{ github.sha }}"
