name: Catalogue

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "catalog/apps/**"
      - "catalog/deals/**"
  push:
    branches: [main]
    paths:
      - "catalog/apps/**"
      - "catalog/deals/**"
      - "scripts/sync-catalogue-changes.mjs"
      - "scripts/lib/catalogue-sync-client.mjs"
      - "src/lib/catalogue/**"
      - "src/app/api/internal/catalogue-sync/**"
      - ".github/workflows/catalogue.yml"

# Keep reconciliation runs in order; do not interrupt a partially imported run.
concurrency:
  group: catalogue-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Restrict public contributions to one new catalogue record
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t changes < <(git diff --name-status "$BASE_SHA" "$HEAD_SHA")
          if [[ ${#changes[@]} -ne 1 ]]; then
            echo "Public pull requests may only add exactly one application or deal manifest. Open an issue for every other kind of change."
            printf '%s\n' "${changes[@]}"
            exit 1
          fi

          IFS=$'\t' read -r status changed_path <<< "${changes[0]}"
          if [[ "$status" != "A" || ! "$changed_path" =~ ^catalog/(apps|deals)/[a-z0-9]+(-[a-z0-9]+)*\.json$ ]]; then
            echo "Public pull requests may only add one new catalogue manifest and change nothing else. Open an issue for every other kind of change."
            exit 1
          fi
      - run: node scripts/validate-catalogue.mjs

  sync:
    timeout-minutes: 30
    # Reconcile valid files even when a different manifest fails validation.
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push event can contain more than one commit. Full history keeps
          # the before/after diff reliable for every accepted main-branch push.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Create pending editorial revisions
        env:
          CATALOG_SYNC_SECRET: ${{ secrets.CATALOG_SYNC_SECRET }}
          CATALOG_SYNC_URL: ${{ secrets.CATALOG_SYNC_URL }}
        run: node scripts/sync-catalogue-changes.mjs "${{ github.event.before || github.sha }}" "${{ github.sha }}"
